# Dependabot configuration for the newbie starter template.
#
# This repo is the single source of truth for the newbie basic template
# (see ADR-003 in worldzhy/newbie). Dependabot watches npm dependencies
# and GitHub Actions used by the template so generated apps start from a
# current, CVE-clean skeleton.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    labels:
      - "dependencies"
    # Group patch-level bumps to reduce PR noise; minor/major stay separate
    # so breaking changes get individual review.
    groups:
      patch-updates:
        update-types:
          - "patch"
      # @nestjs/* packages must move in lockstep — framework peers span the
      # family and partial upgrades break npm ci.
      nestjs:
        patterns:
          - "@nestjs/*"
      # @typescript-eslint/parser and eslint-plugin must stay on the same
      # major; they cross-peer each other.
      typescript-eslint:
        patterns:
          - "@typescript-eslint/*"
    # typescript-eslint does not support TypeScript 7 yet
    # (https://github.com/typescript-eslint/typescript-eslint/issues/10940).
    # Revisit once upstream ships TS 7 support.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "ci"
