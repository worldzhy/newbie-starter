# Build gate for the newbie starter template.
#
# This repo IS the template (ADR-003 in worldzhy/devbie) — nightwatch's GitHub
# generate flow clones it as-is. A green build here is the only guarantee that
# generated apps start from a working skeleton, so every push and PR must
# produce a clean `nest build`.
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Lockfile is tracked, so npm ci gives a reproducible install that
      # matches what the maintainer validated locally.
      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      # ADR-009 D4: every file this template ships must be classified in the
      # newbie CLI ownership registry (unlisted = error), and the template must
      # match its own registry version.
      - name: Template ownership registry
        run: npm run check:template

      - name: Lint
        run: npm run lint

      # prisma.config eagerly resolves PRISMA_DATABASE_URL even for generate;
      # use a non-connecting placeholder — generate never opens a connection.
      - name: Prisma generate
        run: npx prisma generate
        env:
          PRISMA_DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      - name: Build
        run: npm run build

      # ADR-008 verification chain #3: the merged three-layer compose model
      # must stay valid, including the UI-less shape (frontend is gated
      # behind the "ui" profile; caddy marks that dependency required: false).
      - name: Validate merged compose model
        working-directory: deploy
        run: |
          printf 'APP_NAME=ci-smoke\nECR_REPOSITORY_PREFIX=placeholder\nIMAGE_TAG=ci\n' > .env
          docker compose -f compose.framework.yml -f compose.modules.yml -f compose.application.yml config --quiet
          COMPOSE_PROFILES=ui docker compose -f compose.framework.yml -f compose.modules.yml -f compose.application.yml config --quiet
          rm .env
