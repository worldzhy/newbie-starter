# Production stack for the app.
#
# Runs on a single EC2 host behind Caddy. Only Caddy publishes host ports
# (80/443); every other service is reachable only on the internal "nwb"
# network. Variables are interpolated from .env in this directory, rendered
# by scripts/render-env.sh: app keys come from the Secrets Manager secret
# (env.config.json), deployment plumbing (ECR_REPOSITORY_PREFIX / IMAGE_TAG /
# AWS_REGION) comes from deploy.config.json (ADR-006 C1). Data directories
# use paths relative to this file's directory — no host literals here.
#
# Routing contract (see ADR-012):
#   /healthz        -> Caddy responds directly
#   /web-monitor/*  -> backend as-is (web-monitor SDK reports are natively
#                      served under /web-monitor; stripping the prefix 404s them)
#   /api/*          -> backend with /api stripped (mirrors the dev rewrite)
#   everything else -> frontend

name: ${APP_NAME}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - nwb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # requirepass comes from the host-interpolated .env (compose reads
    # .env from its project directory).
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - ./data/redis:/data
    networks:
      - nwb
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:8
    restart: unless-stopped
    # Cap the WiredTiger cache: the 50%-of-RAM default assumes a dedicated
    # host and would fight ClickHouse/Postgres on this shared box (ADR-015).
    command: ["mongod", "--wiredTigerCacheSizeGB", "2"]
    env_file:
      - ./.env
    volumes:
      - ./data/mongo:/data/db
    networks:
      - nwb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:26.8-alpine
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: "262144"
        hard: "262144"
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
      # Cap server memory: the ~90%-of-RAM default assumes a dedicated host
      # (ADR-015).
      - ./clickhouse/config.d/memory.xml:/etc/clickhouse-server/config.d/memory.xml:ro
    networks:
      - nwb
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Backup helper, never started with the normal stack ("backup" profile).
  # Invoked by scripts/backup.sh; uploads to S3 using the EC2 instance role.
  clickhouse-backup:
    image: altinity/clickhouse-backup:2.8.1
    profiles: ["backup"]
    env_file:
      - ./.env
    environment:
      CLICKHOUSE_HOST: clickhouse
      # clickhouse-backup speaks the native protocol, not HTTP.
      CLICKHOUSE_PORT: "9000"
      CLICKHOUSE_USERNAME: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REMOTE_STORAGE: s3
      S3_BUCKET: ${BACKUP_BUCKET}
      S3_PATH: clickhouse
      S3_REGION: ${AWS_REGION}
      S3_ACL: private
      LOG_LEVEL: info
    volumes:
      - ./data/clickhouse:/var/lib/clickhouse
    networks:
      - nwb
    depends_on:
      clickhouse:
        condition: service_healthy

  postgres-migrate:
    image: ${ECR_REPOSITORY_PREFIX}/${APP_NAME}-backend:${IMAGE_TAG}
    restart: "no"
    env_file:
      - ./.env
    command: ["npx", "prisma", "migrate", "deploy"]
    networks:
      - nwb
    depends_on:
      postgres:
        condition: service_healthy

  # Forward-only ClickHouse schema migrations. Mirrors the postgres-migrate
  # one-shot: backend starts only after this exits successfully. Migration SQL
  # ships with the owning modules under clickhouse-migrations/ and is compiled
  # into dist via nest assets (ADR-014).
  clickhouse-migrate:
    image: ${ECR_REPOSITORY_PREFIX}/${APP_NAME}-backend:${IMAGE_TAG}
    restart: "no"
    env_file:
      - ./.env
    command: ["node", "dist/src/modules/clickhouse/migration/migrate-cli.js", "deploy"]
    networks:
      - nwb
    depends_on:
      clickhouse:
        condition: service_healthy

  backend:
    image: ${ECR_REPOSITORY_PREFIX}/${APP_NAME}-backend:${IMAGE_TAG}
    restart: unless-stopped
    env_file:
      - ./.env
    expose:
      - "3000"
    networks:
      - nwb
    stop_grace_period: 30s
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:3000/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    depends_on:
      postgres-migrate:
        condition: service_completed_successfully
      clickhouse-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      clickhouse:
        condition: service_healthy

  frontend:
    image: ${ECR_REPOSITORY_PREFIX}/${APP_NAME}-frontend:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      - PORT=3001
      - HOSTNAME=0.0.0.0
    expose:
      - "3001"
    networks:
      - nwb
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "require('http').get('http://127.0.0.1:3001/',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - nwb
    depends_on:
      - frontend
      - backend

networks:
  nwb:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
